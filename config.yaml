# THRONG v2 — Phase 7: Rich World + Episodic Memory + Red Co-evolution
#
# Three architectural additions:
# 1. Episodic memory buffer per agent (20 slots of signal+action+survival)
# 2. Three new world objects: shelter spots, contested resources, scent trails
# 3. Red co-evolution: reds get their own PPO policy (hidden_dim=128)
#
# USE: python main.py --config config_phase7.yaml --fresh

grid_size: 128
window_size: 1200

population_size: 200           # P10.5 Hard-Ceiling: cap blues (no 500-agent entropy explosion)
max_population: 200
max_pop: 200
min_population: 150              # P10.5 Goldilocks: 150–200 high-stress band
red_population_size: 250         # P10.4 Safety Bubble: full red ecology pressure
max_pop_red: 250
min_red_population: 250          # P4b: max red pressure immediately on resume
repro_energy_thresh: 0.95        # P10.2 Metabolic Squeeze: rare clones (was 0.80)
repro_energy_cost: 0.80          # P10.2: cloning nearly starves parent (was 0.40)
# 2026-09-20 (Cam): per-birth probability the offspring's is_big_green flips
# relative to its parent -- a rule of the world, not a floor. Without this,
# parent-sampling for new spawns is uniform by current alive count with zero
# weighting by type, which makes small-blue extinction a one-way ratchet: at
# 0 small-blue alive, every new spawn is confirmed big-green, permanently
# (verified in tests/test_population_composition_lockin.py). Landed after
# confirming predation is structurally impossible without it -- see
# docs/THE-ECOLOGY-NEVER-RAN.md.
is_big_green_mutation_rate: 0.03

# Curriculum
curriculum_red_count: 6
curriculum_blue_threshold: 80
curriculum_sustain_steps: 2000
curriculum_survival_threshold: 0.80   # blue survival rate to advance red floor
curriculum_sustain_updates: 5         # consecutive PPO updates above threshold

max_age: 1000                 # P10.4 Safety Bubble: above JAX default 500; room for mean age 150+
base_maturation_steps: 200

# Brain architecture — 4L from birth
n_layers: 4
brain_max_layers: 6
brain_token_dim: 128
brain_n_heads: 4
agent_hidden_dim: 256
signal_dim: 40
symbol_dim: 16

neighbor_k: 6
local_obs_radius: 2              # 5×5 patch
env_channels: 15                 # Phase 18.7: 10 base + wood, stone, flint, clay, vine
own_state_dim: 22                # Phase 18.7: 13 + flint, clay, vine, recipe[5], can_see_recipe
n_actions: 12                    # Phase 18: N,S,E,W,Stay,Strike,Push,Guard,Build,PickUp,Craft,UseTool
                                 # (build_cfg overrides identically; defined here so direct-YAML loads
                                 #  — README quickstart, decode/test tools — don't default to 8 and crash
                                 #  the aux one-hot on actions 8–11)

# Theory of mind head
tom_enabled: true
tom_lr: 1.0e-4
tom_reward_coef: 0.0            # ZERO artificial rewards in Phase 7
tom_head_independent: true

# Signal gate
signal_gate_enabled: true
signal_gate_mask_frac: 0.5

symbol_decay: 0.993

red_starvation_steps: 400
red_spawn_step: 2000
red_catch_radius: 1          # P4: adjacent reds catch blues (Chebyshev ≤ 1)
red_catch_prob: 0.8          # P10.4: 20% predator jitter on in-range catches

# ── VQ signal bottleneck (P3) ─────────────────────────────────────────────────
vocab_size: 64
vq_beta: 0.25
vq_loss_coef: 0.1               # blue VQ commitment coef (live PPO gradient)
red_vq_loss_coef: 0.0           # Phase 18.6: red VQ DECOUPLED from gradient (red = pure
                                # ecological pressure; language forged by catch reward only,
                                # directive #8). Set >0 (+ one-time cold restart) only if red
                                # comms is ever promoted back to a science target.
vq_dead_code_reset: true
# Task 4 (AUDIT_SEP2026.md / docs/WILL_RESTART_SEP2026.md): persistent
# usage-EMA dead-code reset. A code resets only after `vq_dead_code_window`
# consecutive PPO updates with zero usage (was: any single window), and the
# whole update is skipped when the alive-agent pool that window is below
# `vq_dead_code_min_pool_frac` of max_pop (a thin pool can't support a
# vocab_size-code usage estimate).
vq_dead_code_window: 5
vq_dead_code_min_pool_frac: 0.25
vq_dead_code_ema_decay: 0.8
gumbel_tau: 0.5

# ── Anneal: diversity → crystallization ───────────────────────────────────────
gumbel_tau_start: 0.5
gumbel_tau_end: 0.5
gumbel_tau_anneal_start: 20000
gumbel_tau_anneal_end: 50000

# ZERO signal entropy bonus — structure must arise from survival gradient
signal_entropy_coef_start: 0.0
signal_entropy_coef_end: 0.0
signal_entropy_anneal_start: 20000
signal_entropy_anneal_end: 50000

# ── Procedural environment ────────────────────────────────────────────────────
wall_density: 0.08
resource_n_patches: 10           # P10.3 Famine: half map patches (was 20)
resource_regen_rate: 0.0003      # P10.4 Safety Bubble: +20% vs P10.3 famine (0.00025)
resource_max: 0.5                # P10.3: cap cell resources (default 1.0)
resource_spawn_boost: 0.1       # P10.3: per-step spawn increment (was hardcoded 0.2)

# ── Phase 7: New world objects ────────────────────────────────────────────────
shelter_n_spots: 5              # shelter spots per map
contested_n_nodes: 3           # contested resource nodes
contested_yield_multiplier: 3.0 # 3× normal food, requires 2+ agents
contested_min_harvesters: 2
scent_decay_steps: 20          # scent trail fades over 20 steps
scent_intensity: 0.8          # initial scent strength when red passes

# ── Phase 7: Episodic memory ─────────────────────────────────────────────────
memory_buffer_size: 20          # slots per agent (0 = disabled)
memory_buffer_enabled: true

# ── Phase 7: Red co-evolution ────────────────────────────────────────────────
red_policy: true
red_hidden_dim: 128             # half the blues' capacity (256→128)

# ── Phase 7.5: Dual cultural memory grids ───────────────────────────────────
culture_fast_decay: 0.90         # fast-decay layer: recent danger / coordination
culture_slow_decay: 0.995        # slow-decay layer: stable landmarks / long-term memory
culture_intensity: 0.3           # how strongly agents write to shared memory

# ── Phase 7.5b: Mind-Melding (live knowledge transfer) ─────────────────────
mind_meld_enabled: true
mind_meld_radius: 1              # agents within 1 cell can meld
mind_meld_rate: 0.1              # fraction of carry overwritten per step
mind_meld_direction: older_to_younger  # or "bidirectional"

# ── Phase 7.5c: Evolutionary Distillation ─────────────────────────────────
distill_enabled: false         # P4b Selective Squeeze: off during raw selection test
distill_interval: 10000          # steps between distillation events
distill_keep_frac: 0.05          # top 5% survive
distill_noise_std: 0.1           # Gaussian noise on cloned carries

# ── Phase 7.5d: Cooperative Puzzle (Lock-and-Key) ──────────────────────────
puzzle_enabled: true
puzzle_n_nodes: 3                # number of lock-key pairs
puzzle_switch_distance: 2        # how close to stand on switch
puzzle_reward: 5.0               # massive reward for solving
puzzle_timeout: 100              # steps before puzzle resets

# ── Energy mechanics ─────────────────────────────────────────────────────────
energy_decay: 0.001
alarm_metabolic_cost: 0.006
starvation_threshold: 0.1
reward_resource: 0.1
reward_craft_success: 3.0
reward_futile_craft: -0.20
resource_decay: 0.05                 # how much resource depletes per consumption step

# ── MAPPO ──────────────────────────────────────────────────────────────────────
ppo_rollout_steps: 512
ppo_epochs: 1
ppo_minibatch_size: 512   # 500 agents × 512 steps; 2048 minibatch OOMs backward on A100
ppo_warmup_steps: 15
ppo_clip: 0.2
ppo_clip_eps: 0.2
ppo_lr: 3.0e-4
ppo_gamma: 0.999                 # P10.5: long-horizon survival (500+ step credit)
ppo_gae_lam: 0.95
ppo_value_coef: 0.1
ppo_entropy_coef: 0.02
alarm_ent_coef: 0.0
action_entropy_coef: 0.05      # Explicit action diversity bonus
ppo_max_grad_norm: 2.0

# Rewards
reward_blue_alive: 0.05
reward_blue_caught: -2.0      # P4: harsher death penalty for caught blues
reward_red_catch: 3.0         # P4: stronger hunt incentive
reward_red_starve_per_step: -0.02
reward_move: 0.01
reward_red_move: 0.04        # P4: reward red movement (hunter aggression)

# ── P10.4 Safety Bubble (NB_GAIN temporal depth: mean age 150+) ───────────────
# Predator jitter: red_catch_prob (not detection_radius — blues stay blind)
# Slightly more regen than P10.3 famine; repro still squeezed (P10.2 thresholds)

# ── P10.5 Hard-Ceiling (population 150–200, γ=0.999) ─────────────────────────
# Blues capped at 200; min 150 — no hyper-breeding luxury band at 500

# Observation constraints
red_detection_radius: 0          # 0 = blind beyond 5×5 patch; need neighbor signals (Phase 10)
red_curriculum_stages: [250]       # P4b: locked at max reds (hot-resume stays at 250)
resource_obs_noise: 0.2         # 20% Gaussian noise on resource observations

brain_vote_interval: 5000
brain_vote_survival_threshold: 0.55
force_brain_layers: 4

# ── Misc ──────────────────────────────────────────────────────────────────────
steps_per_render: 32
target_fps: 60
dashboard_update_interval: 20.0

log_dir: runs_large
checkpoint_interval: 2000
log_interval: 200

# 2026-09-14 (Cam): resume_from_step: 2541 lived here as a deliberate
# rollback. The calibration ladder's codes_active rule ("latest checkpoint
# whose codes_active is within 2x of the per-slot ladder maximum, on every
# slot independently") picked 2541 -- not 2763 (the stopped launch's actual
# resume point) and not 2493 (the retired rel_spread rule's answer).
# Per-slot ladder maxima 41|39|32 -> half-maxima 20.5|19.5|16; 2763 fails on
# slot1 (12), 2760 fails on slot0 (16). ~320 updates of training discarded;
# accepted, since training a dead channel forward buys nothing.
#
# 2026-09-15 (Cam): removed. A pin left standing in config.yaml is
# permanent, not one-time -- it silently fought the fossil guard
# (jax_sim/main_jax.py, find_fossil_checkpoints) on this run's own very
# next restart: the moment checkpoints_r2541/ gained a real 2542, the pin
# still said "resume target is 2541," and the guard would have read 2542 as
# a fossil ahead of that target and refused to launch on our own progress.
# checkpoints_r2541/ already IS the pin, made structural instead of
# configured: seeded with only 2541, so "latest" already equals 2541 on
# first launch, and correctly advances to whatever the true latest is on
# every restart after. The invariant that actually needs to hold, with no
# special cases: never resume from a step below the highest checkpoint in
# checkpoint_dir. The guard enforces exactly that now, unconditionally.
# Re-adding this key for a future deliberate rollback is legitimate (the
# mechanism itself is untouched), but it must be paired with moving every
# higher-numbered checkpoint out of checkpoint_dir first (see fossils/ on
# the volume) and removed again before the next restart -- a temporary,
# one-time override, never a standing config value.

mi_analysis_interval: 1000
mi_window: 1000
signal_cluster_k: 12

# Signal corpus (offline language analysis) — P10.6 tight causal lag (~4 env steps)
corpus_sample_frac: 0.15
corpus_every_n_steps: 4

# Within-lifetime Hebbian learning
hebb_lr: 0.001

# Alarm call analysis
alarm_scout_range: 8
alarm_min_group: 20

# Phase 11 staging (feature/phase11-imagination only — not on master P10.6 run)
carry_fwd_coef: 0.05   # MSE on carry_{t+1}; target always stop_gradient

# Phase 9 canvas (feature/phase9-canvas) — cross-attention receiver for neighbor signals
phase9_canvas:
  cross_attn_enabled: false   # scaffold: set true to compile 9.4 path (new params)
  cross_attn_num_heads: 4
  confidence_enabled: true    # Sep 2026 restart (Cam's ruling, AUDIT_SEP2026.md Finding 2):
                              # the epistemic gate has been consulting this head every rollout
                              # step regardless of this flag — running it untrained was worse
                              # than either training it or turning the gate off. See
                              # reset_confidence_head_on_resume below: the checkpoint's existing
                              # weights are a fossil and must not just resume training in place.
  confidence_coef: 0.05
  reset_confidence_head_on_resume: false  # Flipped 2026-09-13: the one-time trigger fired --
                              # checkpoint 2778 (env step 1,422,336) saved successfully after
                              # the deliberate reset at this restart. head_confidence_1/2 is now
                              # actually training (conf_loss=1.0e-5 at ppo 2764, down from the
                              # ckpt-2763 fossil); leaving this true would re-randomize it on
                              # every future resume. Was ONE-TIME at this restart only (Cam's
                              # ruling): ckpt 2244/2763's head_confidence_1/2 was bit-identical
                              # across both — trained once in the Phase 9.1 era, then carried
                              # frozen through every graft since, predicting carry-forward error
                              # for a dead 8-action architecture.
  # Phase 11.3 — epistemic imagination gating (feature/phase11-3-epistemic-gate)
  imagination_gating_enabled: true
  confidence_multiplier: 1.0   # batch-relative gate: imagine if conf < mean(conf|alive)*mult
  imagination_k: 5
  imagination_gamma: 0.999
  imagination_n_actions: 12     # how many actions the K-step mental rollout scores.
                               # 5 = legacy (Stay + N/S/E/W only). Set to 12 to let the
                               # gate deliberate over Strike/Push/Guard + tool actions.
                               # Behavioural change — A/B against a fresh run before adopting.
  # Phase 13.0 — metabolic cost per K-step thought (total = delta * K per gate use)
  imagination_metabolic_delta: 0.0005

# Phase 12 — adversarial co-evolution (feature/phase12-red-coevolution; off on production P11.3)
phase12_coevolution:
  red_comms_enabled: true        # branch default: 128-d PredatorNetwork (matches volume r_params)
  red_cross_attn_enabled: true
  red_vocab_size: 64
  red_vq_noise_scale: 0.5
  red_corpus_enabled: true       # 12.1 wiretap — signal_corpus_red.jsonl (requires red_comms_enabled)
  hunt_scout_range: 8            # symmetric with alarm_scout_range (blue scout label)

# Phase 14.1b/c — VQEL monologue + wire cut + graduation (feature/phase14-transcendental)
phase14_vqel:
  monologue_enabled: false       # post-600k: skip monologue; hard dialogue on startup
  monologue_lr: 0.00003          # low LR to protect 320k MAPPO policy in shared trunk
  recon_coef: 1.0
  hash_penalty_coef: 0.5
  vq_coef_monologue: 1.0
  graduate_recon_mse: 0.02       # P14-1c: exit monologue when recon MSE stays below this
  graduate_consecutive_updates: 10
  dialogue_signal_mode: hard     # discrete z_q broadcast (graduated state)

# Phase 14.1b — proprioceptive disentanglement (energy from carry, not VQ wire)
proprio_coef: 0.15
retention_coef: 0.1

# Phase 14.2 — Metabolic Asymmetry (apex predators: slow red energy decay)
phase14_transcendental:
  red_energy_decay: 0.0001   # 10× slower than blue energy_decay (0.001); same starvation_threshold
  # P14.4 SimVQ — stateless W bound (forward only; no new params; ckpt 1413 compatible)
  simvq_w_clip: 2.0          # clip simvq_W at matmul time
  simvq_out_scale: 2.0       # tanh projection × scale → signal in [-2, 2]
  reset_red_vq_on_resume: false # SAFEGUARD: Phase 15 codebook is healed, do not nuke it again

exit_on_graduation: false

# Phase 15.0 — Cumulative Culture (MEDAL-ADR Expert Dropout)
phase15_cumulative_culture:
  medal_adr_enabled: true
  medal_adr_prob: 0.10       # Phase 18.7 receiver-reset test

# Phase 16.0 — Open-Ended Combinatorial Complexity
phase16_combinatorial_syntax:
  reward_small_blue: 3.0
  reward_big_green_success: 8.0
  reward_big_green_solo_penalty: -1.0
  reward_big_green_solo_catchable: 2.0  # Used during 0-100k step scaffold
  r_coord: 1.5
  coop_threshold_step: 100000
  num_actions: 8

# CtD competence ramp (2026-09-14, Cam's sign-off -- see RESEARCH_PROTOCOL.md
# Part 3 and jax_sim/ctd_ramp.py). Modelled on the Phase 16 CtD gate directly
# above: one easy regime, one ratchet to full difficulty, no interpolation.
# Both fossils (blue's crafting-avoidance, red's hunting-avoidance) were
# trained ~1.4M steps under a broken ecology; this gives each a period where
# the mechanism it avoided is actually reachable before facing real friction.
# This is a genuine ecological change (Rule 12) -- signed off explicitly, not
# implemented by default judgment.
#
# Crafting ramp is two capped stages, not one (Cam's correction, 2026-09-14):
# a single max_units=2 stage is still a cooperative problem at smaller scale,
# not the solo-catchable analogue. Stage sequence is fixed by
# jax_sim.ctd_ramp.CRAFT_RAMP_STAGE_UNITS = (1, 2) -- solo-satisfiable, then
# pair-satisfiable, then this config's floor/bar/ceiling ratchets to the full
# (up to 4-unit) recipe. Not configurable per-run; the floor/bar/window/
# ceiling below are reapplied fresh at each stage.
ctd_competence_ramp:
  craft_ramp_enabled: true
  # Exit criteria revised 2026-09-14 (Cam), after the real launch showed
  # codes_active collapse to 1|3|3/64 (VQ loss=2.30e-09) under stage 0:
  # the 20%-sustained-over-10-updates bar was written without knowing stage
  # 0 (solo-satisfiable) removes all communication pressure --
  # futile_uncoordinated=0 across all twenty updates meant coordination
  # wasn't failing, it wasn't required, and the channel atrophied because
  # nothing used it. Stage 0's actual purpose is a behavioural milestone
  # (teach that Craft has value), which success=123 at 7.1% already showed
  # was learned well inside the old bar. New bar is deliberately easier to
  # clear, not harder: every update past competence is pure channel atrophy.
  # Bar retired from success/attempts to per-capita 2026-09-14 (Cam):
  # attempts is an agent-controlled denominator -- observed live, success
  # stayed flat (40->35) while futile_wrong_mats nearly tripled
  # (2875->7432), so the rate FELL (1.3%->0.4%) purely because blue spammed
  # Craft harder without materials. An agent that tries more looks less
  # competent under that metric; it cannot measure competence, by
  # construction (same instrument-validity standard as the rel_spread
  # retirement -- argued from the mechanism, not from whether it passed).
  # success/living_blue_population isn't gameable the same way. 10% is
  # deliberately easy: at blue~195 that's ~20 successes, already well
  # inside the observed 35-40/update.
  #
  # min_steps dropped 50000 -> 5120 (10 updates), 2026-09-14 (Cam, next-
  # launch change -- NOT applied retroactively to a run already in flight,
  # since restarting to pick it up would throw away a healthy post-reset
  # codebook and a hard-won stability-gated C0). The floor was sized for
  # the retired success/attempts bar and now dominates the per-capita bar
  # entirely: observed live, the per-capita bar cleared by update 4
  # (streak 3/3, pop_frac 28-80%), but 50000 steps (~98 updates) blocked
  # "bar met" from ever firing before stage0_hard_escape=40 updates
  # (20480 steps) fired first -- the bar was doing nothing, the escape was
  # the real exit every time. The floor exists to stop an exit on noise;
  # "3 consecutive updates above 10% per-capita" already does that job, so
  # a much shorter floor (10 updates -- enough for the streak window
  # itself to complete once, no more) restores the bar as the mechanism
  # that actually decides when stage 0 ends.
  craft_ramp_min_steps: 5120        # floor: an advance never fires before this many steps into the stage
  craft_ramp_success_bar: 0.10     # successes this update, as a fraction of the LIVING BLUE POPULATION
  craft_ramp_success_window: 3     # consecutive PPO updates the bar must hold
  craft_ramp_max_steps: 1000000    # hard ceiling per stage: forced advance + loud report if the bar is never met
  # 2026-09-14 (Cam): stage-0-specific hard escape, tighter than
  # craft_ramp_max_steps above. Live on the 2541 resume: craft rate 1.3% ->
  # 0.4% while futile_wrong_mats nearly tripled -- the bar was receding, not
  # approaching. Stage 0 has no communication pressure (it's the phase that
  # ate the channel last time), so a bar that may never clear would silently
  # turn a deliberately short phase into an unbounded one. 40 PPO updates,
  # measured from stage 0's own start.
  craft_ramp_stage0_max_updates: 40
  red_ramp_enabled: true
  red_ramp_beta: 2.5               # shaping coefficient (verified: full 1-cell close ~= reward_red_move)
  red_ramp_min_steps: 200000
  red_ramp_catch_bar: 1.0          # catches/update that must be sustained to ratchet on the bar
  red_ramp_catch_window: 10
  red_ramp_max_steps: 1000000

# Phase 16.5 — Environmental Enrichment & Metabolic Routing
phase16_5_enrichment:
  barrier_build_cost: 0.15
  feral_threshold: 0.20
  barrier_decay_rate: 0.05
  ignition_discount: 0.1
