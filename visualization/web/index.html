<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THRONG Telemetry Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
</head>
<body>
    <div class="dashboard-container">
        <header class="header">
            <div class="brand">
                <h1>THRONG <span class="badge">LIVE</span></h1>
                <p id="step-counter" class="subtitle">Waiting for telemetry...</p>
            </div>
            <div class="status-indicator">
                <div class="pulse"></div>
                <span>Connected</span>
            </div>
        </header>

        <main class="grid-layout">
            <div class="panel">
                <div class="panel-header">
                    <h2>Population & Energy</h2>
                    <span class="panel-icon">📈</span>
                </div>
                <div class="chart-container">
                    <canvas id="populationChart"></canvas>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h2>Fitness (age × consumed)</h2>
                    <span class="panel-icon">⭐</span>
                </div>
                <div class="chart-container">
                    <canvas id="fitnessChart"></canvas>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h2>Mutual Information</h2>
                    <span class="panel-icon">🧠</span>
                </div>
                <div class="heatmap-container">
                    <canvas id="miChart"></canvas>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h2>Lineage Timeline (Top 10)</h2>
                    <span class="panel-icon">🧬</span>
                </div>
                <div class="chart-container">
                    <canvas id="lineageChart"></canvas>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
